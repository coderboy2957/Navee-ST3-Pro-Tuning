<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scooter Live Dashboard & Telemetrie</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(30, 30, 35, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <!-- Header & Verbindung -->
        <div class="flex justify-between items-center border-b border-white/10 pb-4">
            <div>
                <h1 class="text-xl font-semibold tracking-tight">Scooter Cockpit</h1>
                <p class="text-xs text-slate-400">Live Bluetooth Telemetrie</p>
            </div>
            <button id="connectBtn" onclick="toggleConnection()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20">
                Verbinden
            </button>
        </div>

        <!-- Tacho / Hauptanzeige (Geschwindigkeit) -->
        <div class="text-center py-6 bg-white/5 rounded-2xl border border-white/5">
            <span class="text-xs uppercase tracking-widest text-slate-400 font-medium">Geschwindigkeit</span>
            <div class="flex items-baseline justify-center mt-2">
                <span id="speedDisplay" class="text-6xl font-black tracking-tighter text-white">0.0</span>
                <span class="text-lg text-indigo-400 ml-2 font-semibold">km/h</span>
            </div>
        </div>

        <!-- Sekundäre Telemetrie (Grid) -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Leistung / Watt -->
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex flex-col justify-between">
                <span class="text-xs text-slate-400">Motorleistung</span>
                <div class="mt-3">
                    <span id="powerDisplay" class="text-2xl font-bold text-emerald-400">0</span>
                    <span class="text-xs text-slate-500 ml-1">W</span>
                </div>
            </div>

            <!-- Akkustand -->
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 flex flex-col justify-between">
                <span class="text-xs text-slate-400">Akku / Spannung</span>
                <div class="mt-3">
                    <span id="batteryDisplay" class="text-2xl font-bold text-blue-400">--</span>
                    <span id="voltageDisplay" class="text-xs text-slate-500 block mt-0.5">-- V</span>
                </div>
            </div>
        </div>

        <!-- Live Terminal für Rohdaten -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-slate-400">Telemetrie-Stream Log</span>
                <button onclick="clearLog()" class="text-xs text-slate-500 hover:text-slate-300">Leeren</button>
            </div>
            <div id="terminal" class="w-full h-32 bg-black/60 border border-white/10 rounded-xl p-3 font-mono text-[10px] text-slate-400 overflow-y-auto space-y-1">
                <div>// Warte auf Verbindung...</div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice = null;
        let bluetoothServer = null;
        let readCharacteristic = null;

        function log(message, type = 'info') {
            const terminal = document.getElementById('terminal');
            const colorClass = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : 'text-slate-400';
            const timestamp = new Date().toLocaleTimeString();
            terminal.innerHTML += `<div class="${colorClass}">[${timestamp}] ${message}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearLog() {
            document.getElementById('terminal').innerHTML = '<div class="text-slate-500">// Log geleert.</div>';
        }

        async function toggleConnection() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                await bluetoothDevice.gatt.disconnect();
                onDisconnected();
                return;
            }

            try {
                if (!navigator.bluetooth) {
                    alert('Web Bluetooth wird von diesem Browser nicht unterstützt. Bitte Chrome verwenden.');
                    return;
                }

                log('Suche nach Bluetooth-Geräten...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [] // Falls spezifische Services nötig sind, hier eintragen
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                log(`Verbinde mit ${bluetoothDevice.name || 'Gerät'}...`);
                bluetoothServer = await bluetoothDevice.gatt.connect();
                
                log('Suche nach Services und Characteristics...');
                const services = await bluetoothServer.getPrimaryServices();
                
                // Wir nehmen vereinfacht den ersten Service & Characteristic für Notifications
                // (In der Praxis sucht man hier nach der spezifischen Notify-UUID des jeweiligen Scooter-Modells)
                for (const service of services) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        for (const char of characteristics) {
                            if (char.properties.notify) {
                                readCharacteristic = char;
                                await readCharacteristic.startNotifications();
                                readCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
                                log(`Lausche auf Live-Daten von: ${char.uuid}`, 'success');
                                break;
                            }
                        }
                    } catch (e) {
                        // Ignorieren, wenn ein Service geschützt ist
                    }
                }

                if (!readCharacteristic) {
                    log('Keine lesbare Notify-Characteristic gefunden.', 'error');
                }

                updateUIState(true);
                log('Erfolgreich mit Cockpit verbunden!', 'success');

            } catch (error) {
                log(`Verbindungsfehler: ${error.message}`, 'error');
            }
        }

        function onDisconnected() {
            updateUIState(false);
            log('Bluetooth-Verbindung getrennt.');
        }

        function updateUIState(isConnected) {
            const btn = document.getElementById('connectBtn');
            if (isConnected) {
                btn.innerText = "Trennen";
                btn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-medium rounded-xl transition-all";
            } else {
                btn.innerText = "Verbinden";
                btn.className = "px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-xl transition-all";
                document.getElementById('speedDisplay').innerText = "0.0";
                document.getElementById('powerDisplay').innerText = "0";
                document.getElementById('batteryDisplay').innerText = "--";
                document.getElementById('voltageDisplay').innerText = "-- V";
            }
        }

        // Hier kommen die rohen Bytes vom Scooter an
        function handleNotifications(event) {
            const value = event.target.value;
            let byteArray = [];
            for (let i = 0; i < value.byteLength; i++) {
                byteArray.push(value.getUint8(i));
            }

            // Zeige die rohen Bytes im Log (hilft beim Entschlüsseln des Protokolls)
            log(`Empfangen: [${byteArray.map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);

            // BEISPIEL-PARSING (Muss an das echte Protokoll des jeweiligen Scooters angepasst werden):
            // Angenommen Byte 2 ist die Geschwindigkeit und Byte 4 & 5 sind die Leistung:
            if (byteArray.length >= 6) {
                const speed = byteArray[2] || 0; // Beispielhafter Wert
                const power = (byteArray[4] << 8) | byteArray[5]; // 16-bit Watt-Wert

                document.getElementById('speedDisplay').innerText = speed.toFixed(1);
                document.getElementById('powerDisplay').innerText = power;
            }
        }
    </script>
</body>
</html>
