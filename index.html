<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navee Live Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cardBg: 'rgba(20, 22, 30, 0.75)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(18, 20, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-5xl space-y-6">
        
        <!-- HEADER -->
        <header class="glass-panel rounded-3xl p-6 flex flex-wrap justify-between items-center gap-4 shadow-2xl">
            <div>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Navee Cockpit
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">Live Bluetooth Telemetrie</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <div id="statusBadge" class="flex items-center space-x-2 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-full text-xs text-red-400">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="statusText">Getrennt</span>
                </div>
                <button id="connectBtn" onclick="toggleConnection()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 active:scale-95">
                    Scooter Verbinden
                </button>
            </div>
        </header>

        <!-- TACHO DISPLAY -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass-panel rounded-3xl p-8 flex flex-col justify-between relative overflow-hidden">
                <div class="flex justify-between items-center text-xs text-slate-400 font-medium tracking-wider uppercase">
                    <span>Geschwindigkeit</span>
                    <span id="modeBadge" class="px-3 py-1 bg-white/5 border border-white/10 rounded-lg text-indigo-400 font-bold">MODE: --</span>
                </div>

                <div class="my-8 text-center">
                    <div class="inline-block relative">
                        <span id="speedDisplay" class="text-8xl md:text-9xl font-black tracking-tighter text-white text-glow">0.0</span>
                        <span class="text-xl md:text-2xl font-bold text-indigo-400 ml-2">km/h</span>
                    </div>
                    <div class="w-full bg-black/50 h-3 rounded-full overflow-hidden mt-6 border border-white/5">
                        <div id="speedBar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full w-0% transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <!-- MANUELLER BEFEHL -->
            <div class="glass-panel rounded-3xl p-6 flex flex-col justify-between space-y-4">
                <h3 class="text-xs uppercase text-slate-400 font-bold tracking-wider">Manueller Befehl</h3>
                <p class="text-xs text-slate-400">Sende Test-Bytes an Kanal B002:</p>
                <div class="space-y-2">
                    <input type="text" id="manualHex" value="AA 55 01 02" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="sendManualCommand()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition">
                        Befehl Senden
                    </button>
                </div>
            </div>
        </div>

        <!-- TERMINAL -->
        <div class="glass-panel rounded-3xl p-6 space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs uppercase text-slate-400 font-bold">Echtzeit BLE Byte Stream</span>
                <button onclick="clearLog()" class="text-xs text-slate-500 hover:text-slate-300">Terminal Leeren</button>
            </div>
            <div id="terminal" class="w-full h-48 bg-black/80 border border-white/10 rounded-2xl p-4 font-mono text-xs text-slate-400 overflow-y-auto space-y-1 select-text">
                <div class="text-slate-600">// Bereit. Bitte Scooter per Bluetooth verbinden.</div>
            </div>
        </div>

    </div>

    <script>
        let bluetoothDevice = null;
        let bluetoothServer = null;
        let readCharacteristic = null;
        let writeCharacteristic = null;
        let pollInterval = null;

        function log(msg, type = 'info') {
            const term = document.getElementById('terminal');
            const color = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : type === 'warning' ? 'text-amber-400' : 'text-slate-400';
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        function clearLog() {
            document.getElementById('terminal').innerHTML = '<div class="text-slate-600">// Log geleert.</div>';
        }

        async function toggleConnection() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                await bluetoothDevice.gatt.disconnect();
                onDisconnected();
                return;
            }

            try {
                if (!navigator.bluetooth) {
                    alert('Web Bluetooth wird von diesem Browser nicht unterstützt. Bitte Google Chrome nutzen.');
                    return;
                }

                log('Suche nach E-Scootern...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000e000-0000-1000-8000-00805f9b34fb',
                        '0000b000-0000-1000-8000-00805f9b34fb',
                        '0000f000-0000-1000-8000-00805f9b34fb'
                    ]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                log(`Verbinde mit: ${bluetoothDevice.name || 'Gerät'}...`);
                bluetoothServer = await bluetoothDevice.gatt.connect();

                const services = await bluetoothServer.getPrimaryServices();

                for (const service of services) {
                    try {
                        const chars = await service.getCharacteristics();
                        for (const char of chars) {
                            if (char.properties.notify || char.properties.indicate) {
                                readCharacteristic = char;
                                await readCharacteristic.startNotifications();
                                readCharacteristic.addEventListener('characteristicvaluechanged', parseTelemetryData);
                                log(`Notify aktiv auf: ${char.uuid}`, 'success');
                            }
                            if (char.properties.write || char.properties.writeWithoutResponse) {
                                writeCharacteristic = char;
                                log(`Write-Kanal bereit: ${char.uuid}`, 'success');
                            }
                        }
                    } catch (e) {}
                }

                updateUI(true);
                log('Verbindung erfolgreich! Scooter sollte jetzt verbunden sein.', 'success');

                // Starte dezentes Polling im Hintergrund
                startPolling();

            } catch (err) {
                log(`Fehler: ${err.message}`, 'error');
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            const pingCmd = new Uint8Array([0xA5, 0x00, 0x01, 0x00]);

            pollInterval = setInterval(async () => {
                if (writeCharacteristic && bluetoothDevice && bluetoothDevice.gatt.connected) {
                    try {
                        await writeCharacteristic.writeValue(pingCmd);
                    } catch (e) {}
                }
            }, 1000); // Alle 1 Sekunde abfragen, um den Scooter nicht zu überfordern
        }

        async function sendManualCommand() {
            if (!writeCharacteristic) {
                alert('Kein Write-Kanal verbunden!');
                return;
            }
            const input = document.getElementById('manualHex').value.trim();
            const clean = input.replace(/\s+/g, '');
            let bytes = [];
            for (let i = 0; i < clean.length; i += 2) {
                bytes.push(parseInt(clean.substr(i, 2), 16));
            }
            try {
                await writeCharacteristic.writeValue(new Uint8Array(bytes));
                log(`Manuell gesendet: [${input}]`, 'success');
            } catch (err) {
                log(`Manueller Sende-Fehler: ${err.message}`, 'error');
            }
        }

        function onDisconnected() {
            if (pollInterval) clearInterval(pollInterval);
            updateUI(false);
            log('Bluetooth getrennt.');
        }

        function updateUI(connected) {
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('connectBtn');
            const statusText = document.getElementById('statusText');

            if (connected) {
                badge.className = "flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full text-xs text-emerald-400";
                badge.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-500";
                statusText.innerText = "Verbunden";
                btn.innerText = "Trennen";
                btn.className = "px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-red-600/30";
            } else {
                badge.className = "flex items-center space-x-2 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-full text-xs text-red-400";
                badge.querySelector('span').className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                statusText.innerText = "Getrennt";
                btn.innerText = "Scooter Verbinden";
                btn.className = "px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30";
            }
        }

        function parseTelemetryData(event) {
            const dataView = event.target.value;
            let bytes = [];
            for (let i = 0; i < dataView.byteLength; i++) {
                bytes.push(dataView.getUint8(i));
            }

            log(`EMPFANGEN [${bytes.length} Bytes]: ${bytes.map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ')}`, 'success');

            if (bytes.length >= 2) {
                const speed = bytes[2] || 0;
                document.getElementById('speedDisplay').innerText = speed.toFixed(1);
            }
        }
    </script>
</body>
</html>
